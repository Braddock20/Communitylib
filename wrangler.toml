name = "communitylib"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---- Secrets (set in the Cloudflare dashboard, not here) ----
# Workers & Pages -> communitylib -> Settings -> Variables and Secrets -> Add
# Toggle "Encrypt" on for every one of these.
#
#   DATABASE_URL        Neon Postgres connection string (postgres://...)
#   B2_KEY_ID            Backblaze B2 application key ID
#   B2_APPLICATION_KEY   Backblaze B2 application key
#   B2_BUCKET            Backblaze B2 bucket name
#   B2_ENDPOINT          e.g. https://s3.eu-central-003.backblazeb2.com
#   B2_REGION            e.g. eu-central-003
#   DEBUG_KEY            optional — send only in X-Debug-Key header
#   ADMIN_API_KEY         required secret for admin AI/registry/PDF endpoints
#
# IMPORTANT: secrets are attached to the exact Worker script name above
# ("communitylib"). If this project is ever renamed here, every secret
# has to be re-added under the new name — Cloudflare does not carry them
# over automatically. This is the single most common cause of a Worker
# that deploys fine but returns 503 on everything DB/storage related.

[vars]
MAX_FILE_SIZE_MB = "25"
MAX_FILES_PER_UPLOAD = "20"
MAX_TOTAL_UPLOAD_MB = "25"
APP_VERSION = "4.2.0"
AI_PUBLIC_ENABLED = "false"
PDF_PROCESSING_ENABLED = "false"
IMAGE_PDF_COMBINE_ENABLED = "false"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
APP_NAME = "University of Eldoret Student Resources"

# No [[routes]] block: this deploys to the default *.workers.dev subdomain.
# Attach a real custom domain later from the dashboard: Workers & Pages ->
# communitylib -> Settings -> Domains & Routes -> Add -> Custom Domain.
# The UI only lets you pick a zone that already exists on your account,
# which avoids a "Could not find zone" deploy failure.

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Optional Workers AI binding. Enable Workers AI in the Cloudflare account.
[ai]
binding = "AI"

# AI rate limits: initial per-client limits
[[ratelimits]]
name = "AI_CLASSIFY_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "AI_SEARCH_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "AI_ADMIN_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Public API abuse controls. Limits are per Cloudflare client IP; campus NAT
# users share a bucket, so monitor 429 rates and tune if needed. Periods use
# Cloudflare's supported 60-second window.
[[ratelimits]]
name = "PUBLIC_UPLOAD_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PUBLIC_COMMENT_LIMITER"
namespace_id = "2002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PUBLIC_SEARCH_LIMITER"
namespace_id = "2003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PUBLIC_FILE_LIMITER"
namespace_id = "2004"
simple = { limit = 120, period = 60 }
